name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://admin:admin@localhost:5432/guga_flow
      LLM_PROVIDER: mock
      IMAGE_PROVIDER: mock-image
      VIDEO_PROVIDER: mock-video
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guga_flow
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d guga_flow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build
